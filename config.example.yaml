# qgen 配置示例：复制为 config.yaml 后按需修改。
# 敏感项（api_key）建议用环境变量注入，详见 README。

model:
  # OpenAI 兼容协议端点。
  #   - 火山方舟:   https://ark.cn-beijing.volces.com/api/v3
  #   - 本地 vLLM:  http://127.0.0.1:8000/v1
  #   - OpenAI:     https://api.openai.com/v1
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: ""            # 留空则从环境变量 QGEN_API_KEY / ARK_API_KEY / OPENAI_API_KEY 读取
  model: ""             # 必填：模型名或方舟 endpoint id，如 ep-2024xxxx 或 qwen2.5-72b
  # temperature <= 0 表示不发送该参数。gpt-5.x 等 beta 模型强制 temperature=1，必须设为 0。
  temperature: 0.7
  max_doc_chars: 12000   # 单篇文档送入模型的最大字符数，超出截断

kb:
  roots:
    - ".."              # 知识库根目录（相对 qgen 目录）。默认上级即整个知识库
  extensions:
    - ".md"
    - ".txt"
    - ".markdown"
  exclude_dirs:
    - ".git"
    - "node_modules"
    - "qgen"

gen:
  # 按政务业务的 5 个场景分桶出题，场景名写入输出 xlsx 的「场景」列。
  # intent 取值：
  #   intelligent_qa     智能问答（聚焦子议题的事实问答，需检索定位）
  #   extract_uploaded   上传文档萃取分析（文件已上传，问句不点文件名）
  #   extract_retrieval  不上传文档萃取分析（未上传需检索，问句点全称）
  #   write_from_doc     以稿写稿（依据文档写通报/传达稿等正式文体）
  #   rewrite_excerpt    信息撰写（内嵌真实原文，压缩/改写为动态信息）
  intents:
    - intent: "intelligent_qa"
      scene: "智能问答"
      count: 2
    - intent: "extract_uploaded"
      scene: "上传文档萃取分析"
      count: 2
    - intent: "extract_retrieval"
      scene: "不上传文档萃取分析"
      count: 2
    - intent: "write_from_doc"
      scene: "以稿写稿"
      count: 2
    - intent: "rewrite_excerpt"
      scene: "信息撰写"
      count: 2
  concurrency: 4         # 并发处理的文档数
  max_docs: 0            # 最多处理文档数，0 表示不限制（先用小值试跑）

output:
  path: "知识库问题清单.xlsx"
  upload_doc_label: "无（知识库检索）"
